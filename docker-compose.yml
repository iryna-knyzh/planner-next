services:
  postgres:
    image: postgres:16-alpine
    container_name: planner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - "5433:5432"
    volumes:
      - planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job: apply pending Prisma migrations, then exit. The app waits
  # for this to finish. Uses the `builder` stage because it ships the Prisma
  # CLI (the slim runtime image does not).
  migrate:
    build:
      context: .
      target: builder
    image: planner-next-builder
    command: ["pnpm", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: "postgresql://planner:planner@postgres:5432/planner?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    image: planner-next
    container_name: planner_app
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://planner:planner@postgres:5432/planner?schema=public"
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - planner_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  planner_pgdata:
  planner_uploads:
